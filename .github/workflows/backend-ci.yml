name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "ai/scripts/audit_decision_coverage.py"
      - "ai/scripts/build_e2_3_daily_manifest.py"
      - "ai/scripts/render_e2_3_daily_snapshots.py"
      - "ai/scripts/run_e2_3_daily_inference.py"
      - "ai/scripts/evaluate_e2_3_shadow_policy.py"
      - "ai/scripts/evaluate_e2_3_forward_outcomes.py"
      - "ai/scripts/adjudicate_e2_3_m1_intrabar.py"
      - "ai/scripts/generate_e2_4_synthetic_ocr_fixtures.py"
      - "ai/scripts/build_e2_4_external_ocr_fixture_pack.py"
      - "ai/scripts/benchmark_e2_4_price_axis_ocr.py"
      - "ai/scripts/rerun_e2_4_2_windows.ps1"
      - "ai/scripts/validate_e2_2_final_comparison.py"
      - "ai/scripts/validate_project_contract.py"
      - "config/experiments/e2_2_plot_mapping_freeze.json"
      - "config/experiments/e2_2_plot_mapping_decision.json"
      - "config/experiments/e2_3_daily_manifest.json"
      - "config/experiments/e2_3_daily_manifest_result.json"
      - "config/experiments/e2_3_daily_inference.json"
      - "config/experiments/e2_3_high_risk_policy_candidate.json"
      - "config/experiments/e2_3_forward_outcome_policy.json"
      - "config/experiments/e2_3_1_m1_intrabar_adjudication.json"
      - "config/experiments/e2_4_user_screenshot_price_axis_calibration.json"
      - "config/experiments/e2_4_1_ocr_benchmark.json"
      - "config/experiments/e2_4_1_external_result.json"
      - "config/experiments/e2_4_2_ocr_robustness.json"
      - "config/experiments/e2_4_2_development_result.json"
      - "config/project_contract.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "ai/scripts/audit_decision_coverage.py"
      - "ai/scripts/build_e2_3_daily_manifest.py"
      - "ai/scripts/render_e2_3_daily_snapshots.py"
      - "ai/scripts/run_e2_3_daily_inference.py"
      - "ai/scripts/evaluate_e2_3_shadow_policy.py"
      - "ai/scripts/evaluate_e2_3_forward_outcomes.py"
      - "ai/scripts/adjudicate_e2_3_m1_intrabar.py"
      - "ai/scripts/generate_e2_4_synthetic_ocr_fixtures.py"
      - "ai/scripts/build_e2_4_external_ocr_fixture_pack.py"
      - "ai/scripts/benchmark_e2_4_price_axis_ocr.py"
      - "ai/scripts/rerun_e2_4_2_windows.ps1"
      - "ai/scripts/validate_e2_2_final_comparison.py"
      - "ai/scripts/validate_project_contract.py"
      - "config/experiments/e2_2_plot_mapping_freeze.json"
      - "config/experiments/e2_2_plot_mapping_decision.json"
      - "config/experiments/e2_3_daily_manifest.json"
      - "config/experiments/e2_3_daily_manifest_result.json"
      - "config/experiments/e2_3_daily_inference.json"
      - "config/experiments/e2_3_high_risk_policy_candidate.json"
      - "config/experiments/e2_3_forward_outcome_policy.json"
      - "config/experiments/e2_3_1_m1_intrabar_adjudication.json"
      - "config/experiments/e2_4_user_screenshot_price_axis_calibration.json"
      - "config/experiments/e2_4_1_ocr_benchmark.json"
      - "config/experiments/e2_4_1_external_result.json"
      - "config/experiments/e2_4_2_ocr_robustness.json"
      - "config/experiments/e2_4_2_development_result.json"
      - "config/project_contract.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: >-
          python -m pip install
          --requirement backend/requirements-test.txt

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m unittest discover
          -s backend/tests
          -p "test_*.py"
          -v

      - name: Validate project contract
        run: >-
          python ai/scripts/validate_project_contract.py

      - name: Compile backend Python sources
        run: >-
          python -m compileall -q
          backend/app
          backend/tests
          ai/scripts/audit_decision_coverage.py
          ai/scripts/build_e2_3_daily_manifest.py
          ai/scripts/render_e2_3_daily_snapshots.py
          ai/scripts/run_e2_3_daily_inference.py
          ai/scripts/evaluate_e2_3_shadow_policy.py
          ai/scripts/evaluate_e2_3_forward_outcomes.py
          ai/scripts/adjudicate_e2_3_m1_intrabar.py
          ai/scripts/generate_e2_4_synthetic_ocr_fixtures.py
          ai/scripts/build_e2_4_external_ocr_fixture_pack.py
          ai/scripts/benchmark_e2_4_price_axis_ocr.py
          ai/scripts/validate_e2_2_final_comparison.py
